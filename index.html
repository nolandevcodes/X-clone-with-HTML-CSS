<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>X</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="styles/general.css" />
    <link rel="stylesheet" href="styles/header.css" />
    <link rel="stylesheet" href="styles/post.css" />
  </head>
  <body>
    <div class="main-section">
      <div class="header">
        <div class="header-btn">
          <span class="active">For you</span>
        </div>
        <div class="header-btn"><span>Following </span></div>
      </div>

      <div class="post">
        <img class="post-author-avatar" src="icons/user-avatar.jpg" alt="" />
        <div class="">
          <div class="post-info">
            <div class="post-author">
              Justin Bieber
              <span>@justinbieber &#183; 15h</span>
            </div>
            <i class="fa-solid fa-ellipsis more-icon"></i>
          </div>
          <div class="post-content">
            Le Sserafim’s “Spaghetti (feat. j-hope of
            <span class="tag">@BTS_twt</span>)” debuts at #86 on Melon Daily
            Chart 🇰🇷
          </div>
          <div class="action-group">
            <div class="action-btn">
              <i class="fa-regular fa-comment"></i>
              <span>3</span>
            </div>
            <div class="action-btn">
              <i class="fa-solid fa-repeat"></i>
              <span>457</span>
            </div>
            <div class="action-btn">
              <i class="fa-regular fa-heart"></i>
              <span>1.3K</span>
            </div>
            <div class="action-btn">
              <i class="fa-regular fa-eye"></i>
              <span>20K</span>
            </div>
            <div class="action-icon">
              <i class="fa-regular fa-bookmark bookmark-icon"></i>
              <i class="fa-solid fa-arrow-up-from-bracket upload-icon"></i>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
